<!DOCTYPE html>
    <html lang="en">
      <head>
        <title>compass</title>
          <link rel="stylesheet" href="style1.css">
      </head>
    <body>
      <h2>You Got a Compass!</h2>
      
      
      <h4 id="riddleText">
I whisper without a voice, I dance without feet, I vanish when caught. What am I?
      </h4>
     

       
        <h3><a href="homework8b.html">Back to Start</a></h3>

       <script>
const text = document.getElementById("riddleText");
const content = text.textContent;
text.textContent = "";

[...content].forEach((letter, i) => {
    const span = document.createElement("span");

    // Preserve spaces properly
    span.innerHTML = (letter === " ") ? "&nbsp;" : letter;

    span.style.animationDelay = (i * 0.04) + "s";

    text.appendChild(span);
});
</script>
        
    </body>
    </html>
</DOCTYPE>
